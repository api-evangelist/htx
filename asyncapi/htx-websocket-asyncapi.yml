    # ---------- v2 pushes ----------

    AccountsUpdatePush:
      name: AccountsUpdatePush
      title: Account Update Push
      payload:
        type: object
        properties:
          action:
            type: string
            const: push
          ch:
            type: string
          data:
            type: object
            properties:
              currency:
                type: string
              accountId:
                type: integer
                format: int64
              balance:
                type: string
                description: Total balance (only present in modes 0 and 2).
              available:
                type: string
                description: Available balance (only present in modes 1 and 2).
              changeType:
                type: string
                description: |
                  Source of balance change: `order.place`, `order.match`,
                  `order.refund`, `order.cancel`, `order.fee-refund`,
                  `margin.transfer`, `margin.loan`, `margin.interest`,
                  `margin.repay`, `other`.
              accountType:
                type: string
                enum: [trade, frozen, loan, interest]
              changeTime:
                type: integer
                format: int64
              seqNum:
                type: integer
                format: int64
        example:
          action: push
          ch: accounts.update#2
          data:
            currency: usdt
            accountId: 123456
            balance: '23.111'
            available: '20.222'
            changeType: order.match
            accountType: trade
            seqNum: 86872993928
            changeTime: 1568601800000

    OrdersPush:
      name: OrdersPush
      title: Order Update Push
      payload:
        type: object
        properties:
          action:
            type: string
            const: push
          ch:
            type: string
          data:
            type: object
            properties:
              eventType:
                type: string
                enum: [creation, trigger, deletion, cancellation, trade]
              symbol:
                type: string
              accountId:
                type: integer
                format: int64
              orderId:
                type: integer
                format: int64
              clientOrderId:
                type: string
              orderSide:
                type: string
                enum: [buy, sell]
              orderPrice:
                type: string
              orderSize:
                type: string
              orderValue:
                type: string
              type:
                type: string
                description: |
                  Order type, e.g. `buy-market`, `sell-market`, `buy-limit`,
                  `sell-limit`, `buy-ioc`, `sell-ioc`, `buy-limit-maker`,
                  `sell-limit-maker`, `buy-stop-limit`, `sell-stop-limit`,
                  `buy-limit-fok`, `sell-limit-fok`, `buy-stop-limit-fok`,
                  `sell-stop-limit-fok`.
              orderSource:
                type: string
              orderStatus:
                type: string
                enum: [submitted, partial-filled, filled, canceled, partial-canceled, rejected, created]
              errCode:
                type: integer
              errMessage:
                type: string
              lastActTime:
                type: integer
                format: int64
              tradePrice:
                type: string
              tradeVolume:
                type: string
              aggressor:
                type: boolean
              tradeId:
                type: integer
                format: int64
              tradeTime:
                type: integer
                format: int64
              remainAmt:
                type: string
              execAmt:
                type: string
              stopPrice:
                type: string
              operator:
                type: string
        example:
          action: push
          ch: orders#btcusdt
          data:
            orderSide: buy
            lastActTime: 1583853365586
            clientOrderId: abc123
            orderStatus: rejected
            errCode: 2002
            errMessage: invalid.client.order.id (NT)
            symbol: btcusdt
