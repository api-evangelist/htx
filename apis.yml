aid: htx
name: HTX
description: >-
  HTX (formerly Huobi Global) is a cryptocurrency exchange founded in 2013 that
  offers spot trading, futures and derivatives, margin trading, trading bots,
  copy trading, and earn/staking products across BTC, ETH, XRP and 600+ digital
  assets. HTX exposes a public developer platform (HTX Open Platform) with a REST
  API and a WebSocket streaming API covering market data, account and wallet
  management, sub-user administration, spot and conditional order placement, and
  cross/isolated margin lending. Requests are authenticated with an AccessKey and
  an HMAC-SHA256 (Signature Version 2) request signature. Official client SDKs are
  published under the HuobiRDCenter GitHub organization for Java, Python, Go, C++
  and C#, with separate contract/futures variants. HTX was surfaced as a portfolio
  company of Hongshan (formerly Sequoia Capital China).
